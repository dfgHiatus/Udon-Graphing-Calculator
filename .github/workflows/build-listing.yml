name: Build VPM Listing

# Rebuilds index.json (the VCC repository listing) from all GitHub releases and deploys it,
# together with Website/index.html, to GitHub Pages.
# One-time setup: Settings > Pages > Source = "GitHub Actions".

on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [published, edited, deleted]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build listing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/build_listing.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
